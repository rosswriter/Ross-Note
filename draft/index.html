<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>RossDraft</title>
<meta name="description" content="A simple, fast tree of notes, kept as Markdown files in your RossNotes folder.">
<meta name="theme-color" content="#FBF8F1">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/app.css?v=1.9.22-d1.16.0">
<link rel="modulepreload" href="js/app.js?v=1.9.22-d1.16.0">
<link rel="modulepreload" href="js/md.js?v=1.9.22-d1.16.0">
<link rel="modulepreload" href="js/editor.js?v=1.9.22-d1.16.0">
<link rel="modulepreload" href="js/store.js?v=1.9.22-d1.16.0">
<style>
/* shown before anything else has loaded */
#busy.boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #FBF8F1; color: #24211C;
  font: 17px system-ui, sans-serif; z-index: 100; }
@media (prefers-color-scheme: dark) { #busy.boot { background: #1F1E23; color: #E8E3D9; } }
#busy.boot .bar { position: fixed; top: 0; left: 0; right: 0; height: 4px; background: #2F5D8A; opacity: .35; }
</style>
</head>
<body>
<div id="spellbar" hidden></div>
<div id="busy" class="boot" role="status" aria-live="polite"><div class="bar"></div><span class="txt">Starting RossDraft…</span></div>
<div id="app">
  <header id="topbar">
    <button id="b-list" class="tbtn" title="Show or hide the note list (Ctrl+Alt+J)" aria-label="Show or hide the note list"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg></button>
    <nav id="menubar" aria-label="Menus">
      <button data-menu="file"><u>F</u>ile</button>
      <button data-menu="project" hidden><u>P</u>roject</button>
      <button data-menu="edit"><u>E</u>dit</button>
      <button data-menu="insert"><u>I</u>nsert</button>
      <button data-menu="table" hidden>T<u>a</u>ble</button>
      <button data-menu="format">F<u>o</u>rmat</button>
      <button data-menu="review" hidden><u>R</u>eview</button>
      <button data-menu="notes"><u>N</u>otes</button>
      <button data-menu="view"><u>V</u>iew</button>
      <button data-menu="tools" hidden><u>T</u>ools</button>
      <button data-menu="help"><u>H</u>elp</button>
    </nav>
    <div id="crumb" aria-label="Where you are"></div>
    <button id="b-cmd" title="Find a note or a command (Ctrl+K)"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span class="lab">Find or do anything</span><kbd>Ctrl K</kbd></button>
    <button id="b-dark" class="tbtn" title="Light or dark (Ctrl+Shift+D)" aria-label="Light or dark"><svg class="moon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg><svg class="sun" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M5 19l1.5-1.5M17.5 6.5 19 5"/></svg></button>
  </header>
  <header id="toolbar" role="toolbar" aria-label="Formatting" hidden>
    <button id="b-new" class="tb" title="New note">New</button>
    <span class="sep"></span>
    <button data-cmd="bold" class="tb fmt" title="Bold (Ctrl+B)"><b>B</b></button>
    <button data-cmd="italic" class="tb fmt" title="Italic (Ctrl+I)"><i>I</i></button>
    <button data-cmd="underline" class="tb fmt" title="Underline (Ctrl+U)"><u>U</u></button>
    <button data-cmd="strike" class="tb fmt" title="Strikethrough (Ctrl+Shift+X)"><s>S</s></button>
    <button data-cmd="highlight" class="tb fmt hl" title="Highlight (Ctrl+Shift+H)">H</button>
    <span class="sep"></span>
    <button data-cmd="h1" class="tb" title="Heading 1 (Ctrl+1)"><b>H1</b></button>
    <button data-cmd="h2" class="tb" title="Heading 2 (Ctrl+2)"><b>H2</b></button>
    <button data-cmd="h3" class="tb" title="Heading 3 (Ctrl+3)"><b>H3</b></button>
    <button data-cmd="normal" class="tb" title="Normal text (Ctrl+Shift+N)">¶</button>
    <span class="sep"></span>
    <button data-cmd="ul" class="tb" title="Bullet list (Ctrl+Shift+8)">• List</button>
    <button data-cmd="ol" class="tb" title="Numbered list (Ctrl+Shift+7)">1. List</button>
    <button data-cmd="quote" class="tb" title="Indented quote (Ctrl+M)">❝ Quote</button>
    <span class="sep"></span>
    <button data-cmd="date" class="tb" title="Today's date (Ctrl+;)">Date</button>
    <button data-cmd="find" class="tb" title="Find and replace in this note (Ctrl+F, Ctrl+H)">Find</button>
    <button data-cmd="headings" class="tb" title="Go to a heading in this note (Ctrl+Shift+O)">Headings</button>
    <button data-cmd="picture" class="tb" title="Insert a picture or photo">Picture</button>
    <span class="sep"></span>
    <button data-cmd="undo" class="tb" title="Undo (Ctrl+Z)" aria-label="Undo">↶</button>
    <button data-cmd="redo" class="tb" title="Redo (Ctrl+Shift+Z)" aria-label="Redo">↷</button>
    <span class="sep"></span>
    <button data-cmd="smaller" class="tb" title="Smaller text (Ctrl+−)">A−</button>
    <button data-cmd="bigger" class="tb" title="Larger text (Ctrl+=)">A+</button>
    <button data-cmd="splith" class="tb" title="Split side by side (Ctrl+\)">Split ⇆</button>
    <button data-cmd="splitv" class="tb" title="Split top and bottom (Ctrl+Shift+\)">Split ⇅</button>
    <button data-cmd="dark" class="tb" title="Light / dark (Ctrl+Shift+D)" aria-label="Light or dark">☾</button>
    <button data-cmd="share" class="tb" title="Email or share this note">Share</button>
    <button data-cmd="print" class="tb" title="Print or save as PDF (Ctrl+P)">Print</button>
  </header>
  <header id="rwbar" role="toolbar" aria-label="File" hidden>
    <button type="button" class="rb" data-rw="new" title="New scene or note (Ctrl+Alt+N)" aria-label="New scene or note"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6v18h12V7z"/><path d="M14 3v4h4"/></svg></button>
    <button type="button" class="rb" data-rw="open" title="Open: recent, a project, a document (Ctrl+Shift+O)" aria-label="Open: recent, a project, a document"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h6l2 2h10v10H3z"/></svg></button>
    <button type="button" class="rb" data-rw="save" title="Save now (everything is saved as you type)" aria-label="Save now"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3h11l3 3v15H5z"/><path d="M8 3v5h8V3M8 21v-7h8v7"/></svg></button>
    <button type="button" class="rb" data-rw="print" title="Print or save as PDF (Ctrl+P)" aria-label="Print or save as PDF"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 9V3h10v6"/><rect x="3" y="9" width="18" height="8" rx="1"/><path d="M7 14h10v7H7z"/></svg></button>
    <span class="rsep"></span>
    <button type="button" class="rb" data-rw="undo" title="Undo (Ctrl+Z)" aria-label="Undo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
    <button type="button" class="rb" data-rw="redo" title="Redo (Ctrl+Shift+Z)" aria-label="Redo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 14 5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg></button>
    <span class="rsep"></span>
    <button type="button" class="rb" data-rw="find" title="Find and replace (Ctrl+H)" aria-label="Find and replace"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
    <span class="rsep rw-wide"></span>
    <button type="button" class="rb" data-rw="list" title="Show or hide the project list (Ctrl+Alt+J)" aria-label="Show or hide the project list"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="1"/><path d="M3 12h18"/></svg></button>
    <button type="button" class="rb rw-wide" data-rw="outline" title="Outline of this scene (Ctrl+Alt+O)" aria-label="Outline of this scene"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M8 10h12M8 14h12M4 18h16"/></svg></button>
    <button type="button" class="rb" data-rw="panel" title="Comments and notes (the panel on the right)" aria-label="Comments and notes"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16v12H9l-5 4z"/></svg></button>
    <button type="button" class="rb rw-wide" data-rw="draft" title="Pop-up draft (Ctrl+Alt+I)" aria-label="Pop-up draft"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg></button>
    <button type="button" class="rb" data-rw="dark" title="Light or dark (Ctrl+Shift+D)" aria-label="Light or dark"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3v18a9 9 0 0 0 0-18z" fill="currentColor"/></svg></button>
    <span class="rgap"></span>
    <span id="rw-mode" role="group" aria-label="Writing or Page"><button type="button" data-mode="writing" title="Writing: the words fill the width">Writing</button><button type="button" data-mode="page" title="Page: the page's own width, where pages end (Ctrl+Shift+L)">Page</button></span>
    <button type="button" id="rw-cmd" title="Find a scene or a command (Ctrl+K)"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span class="lab">Find or do anything</span><kbd>Ctrl K</kbd></button>
  </header>
  <header id="rwfmt" role="toolbar" aria-label="Formatting" hidden>
    <select id="rwf-style" title="The paragraph's style" aria-label="Style"><option value="normal">Normal</option><option value="h1">Heading 1</option><option value="h2">Heading 2</option><option value="h3">Heading 3</option><option value="quote">Quote</option><option value="ul">Bullet List</option><option value="ol">Numbered List</option></select>
    <button type="button" class="fb rw-wide" data-f="h1" title="Heading 1 (Ctrl+1)"><b>H1</b></button>
    <button type="button" class="fb rw-wide" data-f="h2" title="Heading 2 (Ctrl+2)"><b>H2</b></button>
    <button type="button" class="fb rw-wide" data-f="h3" title="Heading 3 (Ctrl+3)"><b>H3</b></button>
    <select id="rwf-font" class="rw-wide" title="The chosen words' font (Ctrl+D)" aria-label="Font"></select>
    <select id="rwf-size" title="The chosen words' size (Ctrl+Shift+&gt; / &lt;)" aria-label="Size"></select>
    <span class="fsep"></span>
    <button type="button" class="fb" data-f="bold" title="Bold (Ctrl+B)" aria-label="Bold"><b>B</b></button>
    <button type="button" class="fb" data-f="italic" title="Italic (Ctrl+I)" aria-label="Italic"><i>I</i></button>
    <button type="button" class="fb" data-f="underline" title="Underline (Ctrl+U)" aria-label="Underline"><u>U</u></button>
    <span class="fsep rw-wide"></span>
    <button type="button" class="fb rw-wide" data-f="left" title="Align left (Ctrl+L)" aria-label="Align left"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 10h10M4 14h16M4 18h10"/></svg></button>
    <button type="button" class="fb rw-wide" data-f="center" title="Centre (Ctrl+E)" aria-label="Centre"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M7 10h10M4 14h16M7 18h10"/></svg></button>
    <button type="button" class="fb rw-wide" data-f="right" title="Align right (Ctrl+R)" aria-label="Align right"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M10 10h10M4 14h16M10 18h10"/></svg></button>
    <button type="button" class="fb rw-wide" data-f="justify" title="Justify (Ctrl+J)" aria-label="Justify"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 10h16M4 14h16M4 18h16"/></svg></button>
    <span class="fsep rw-wide"></span>
    <label class="rw-wide rwf-sp">Spacing <select id="rwf-spacing" title="Line spacing of the paragraphs" aria-label="Line spacing"><option value="">As doc.</option><option value="1">1.0</option><option value="1.15">1.15</option><option value="1.5">1.5</option><option value="2">2.0</option></select></label>
    <span class="fsep rw-wide"></span>
    <button type="button" class="fb rw-wide" data-f="ul" title="Bullet list (Ctrl+Shift+8)" aria-label="Bullet list"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1" fill="currentColor"/><circle cx="4.5" cy="12" r="1" fill="currentColor"/><circle cx="4.5" cy="18" r="1" fill="currentColor"/></svg></button>
    <button type="button" class="fb rw-wide" data-f="ol" title="Numbered list (Ctrl+Shift+7)" aria-label="Numbered list"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M10 6h10M10 12h10M10 18h10"/><path d="M4 4.5 5 4v4M4 10.5a1 1 0 1 1 2 .3L4 14h2M4 16.5h2l-1 1.5a1 1 0 1 1-1 1.3"/></svg></button>
    <span class="fsep rw-wide"></span>
    <button type="button" class="fb rw-wide" data-f="painter" title="Copy formatting, then click again with words chosen to give them that look (Ctrl+Shift+C / Ctrl+Shift+V)" aria-label="Copy formatting"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><rect x="4" y="3" width="13" height="6" rx="1"/><path d="M17 6h3v5h-8v3"/><rect x="10.5" y="14" width="3" height="7" rx=".5"/></svg></button>
    <button type="button" class="fb" data-f="highlight" title="Highlight (Ctrl+Shift+H); the arrow: its colour" aria-label="Highlight"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="m14 4 6 6-8 8H6v-6z"/><path d="M3 21h18" stroke="#E8C23A" stroke-width="3"/></svg></button><button type="button" class="fb fdrop" data-f="hlmenu" title="Highlight colour" aria-label="Highlight colour">▾</button>
    <button type="button" class="fb rw-wide" data-f="colour" title="Text colour" aria-label="Text colour"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="m6 16 6-13 6 13M8.5 11h7"/><path d="M4 21h16" stroke="#C0392B" stroke-width="3"/></svg></button><button type="button" class="fb fdrop rw-wide" data-f="colourmenu" title="Text colour" aria-label="Text colour list">▾</button>
    <span class="rgap"></span>
    <button type="button" class="fb rw-more" data-f="more" title="The rest of the Format menu">More ▾</button>
  </header>
  <div id="findbar" hidden>
    <input id="find-text" type="search" placeholder="Find in this note" autocomplete="off" enterkeyhint="search">
    <button id="find-prev" title="Previous (Shift+F3)">↑</button>
    <button id="find-next" title="Next (F3, Enter)">↓</button>
    <span id="find-count"></span>
    <input id="find-repl" type="text" placeholder="Replace with" autocomplete="off" enterkeyhint="go">
    <button id="find-one" title="Replace this one and go to the next">Replace</button>
    <button id="find-all" title="Replace every one in this note (Undo takes it all back)">Replace All</button>
    <label><input id="find-case" type="checkbox"> Match case</label>
    <label><input id="find-whole" type="checkbox"> Whole words</label>
    <select id="find-scope" title="Where to look"><option value="note">This note</option><option value="all">All notes</option></select>
    <button id="find-list" title="List every match (Ctrl+Shift+F)">List All</button>
    <button id="find-close" title="Close (Esc)">×</button>
  </div>
  <div id="main">
    <aside id="side">
      <div id="side-top">
        <input id="search" type="search" placeholder="Search the notes…" autocomplete="off">
        <div id="treebar">
          <button data-tree="new" title="New note after this one">+</button>
          <button data-tree="child" title="New note under this one">+›</button>
          <button data-tree="up" title="Move up (Alt+Up)">↑</button>
          <button data-tree="down" title="Move down (Alt+Down)">↓</button>
          <button data-tree="out" title="Move out a level (Alt+Left)">←</button>
          <button data-tree="in" title="Move under the note above (Alt+Right)">→</button>
          <button data-tree="delete" title="Delete the note (to the .trash folder)">🗑</button>
        </div>
      </div>
      <div id="tree" role="tree"></div>
      <div id="count"></div>
    </aside>
    <div id="divider" title="Drag to make the list wider or narrower"></div>
    <div id="panes">
      <section class="pane active" id="pane0">
        <div class="head"></div>
        <div class="scroller"><div id="page" class="page" contenteditable="true" spellcheck="true" autocapitalize="sentences"></div></div>
      </section>
      <div id="pdiv" title="Drag to change the sizes" hidden></div>
      <section class="pane" id="pane1" hidden>
        <div class="head"></div>
        <div class="scroller"><div id="page2" class="page" contenteditable="true" spellcheck="true" autocapitalize="sentences"></div></div>
      </section>
    </div>
  </div>
  <footer id="status">
    <span id="saved" aria-live="polite"></span>
    <button id="langbtn" type="button" hidden title="Review ▸ Language…: the language the words are checked in">English (UK)</button>
    <button id="tracking" type="button" hidden title="Review ▸ Track Changes (Ctrl+Shift+E): what you type and delete is marked">Tracking changes</button>
    <span id="modes"></span>
    <span id="goal" hidden title="Today's words (click to change the target)"><svg width="22" height="22" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="15" fill="none" stroke-width="5" class="track"/><circle cx="20" cy="20" r="15" fill="none" stroke-width="5" stroke-linecap="round" class="done" stroke-dasharray="94.25" stroke-dashoffset="94.25" transform="rotate(-90 20 20)"/></svg><span class="txt"></span></span>
    <span id="rw-page" hidden title="Page Down / Page Up: the next or last page"></span>
    <div id="wc" title="Words (click for the details)"></div>
    <select id="rw-zoom" hidden title="Zoom: the size the page is shown at (Ctrl+= / Ctrl+−)" aria-label="Zoom"></select>
  </footer>
  <aside id="results" hidden><div class="rhead"><span class="rtitle"></span><button class="rclose" title="Close">×</button></div><div class="rlist"></div></aside>
  <div id="popnote" hidden><div class="phead"><span>Quick draft</span>
    <button type="button" class="pbtn pnew" title="A fresh draft (the one you were writing is kept)">New</button>
    <button type="button" class="pbtn pdrafts" title="The earlier drafts in Reminders">Drafts ▾</button>
    <button type="button" class="pbtn pins" title="Put this draft in the page at the cursor">Insert</button>
    <button class="pclose" title="Close (Ctrl+Alt+I)">×</button></div>
    <textarea spellcheck="true" lang="en-GB" placeholder="A quick draft…"></textarea><div class="plist" hidden></div></div>
  <div id="chip" hidden></div>
  <div id="fmtbar" role="toolbar" aria-label="Format the selection" hidden>
    <button data-cmd="bold" title="Bold (Ctrl+B)" aria-label="Bold"><b>B</b></button>
    <button data-cmd="italic" title="Italic (Ctrl+I)" aria-label="Italic"><i>I</i></button>
    <button data-cmd="underline" title="Underline (Ctrl+U)" aria-label="Underline"><u>U</u></button>
    <button data-cmd="highlight" class="hlb" title="Highlight (Ctrl+Shift+H)" aria-label="Highlight">H</button>
    <span class="fsep"></span>
    <button data-cmd="h2" title="Heading (Ctrl+2)" aria-label="Heading">H2</button>
    <button data-cmd="center" title="Centre (Ctrl+E)" aria-label="Centre"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 6h16M7 10h10M4 14h16M7 18h10"/></svg></button>
    <button data-cmd="clear" title="Clear formatting (Ctrl+Space)" aria-label="Clear formatting">✕</button>
  </div>
  <div id="menu" hidden></div>
  <div id="submenu" hidden></div>
  <div id="toast" hidden></div>
  <div id="dialog" hidden><div class="box"><h2></h2><div class="body"></div><button class="big main" id="dialog-close">Close</button></div></div>
</div>
